[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "network-diagnostics"
version = "0.1.0"
description = "Professional cross-platform network diagnostics and monitoring suite."
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]